# Firebase App Hosting configuration.
# Reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Every page except /api/contact is statically prerendered and served from
  # App Hosting's CDN, so the container is only woken for enquiry POSTs and
  # cache misses. Zero idle instances is the right default at this traffic.
  # Raise to 1 if a cold start on the first uncached hit is unacceptable.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # MUST be available at BUILD, not just RUNTIME.
  #
  # All 17 pages are prerendered during `next build`, which is when canonical
  # tags, Open Graph image URLs and every sitemap entry are baked into the HTML.
  # A runtime-only value arrives far too late to change any of them: the site
  # would ship canonicals reading `http://localhost:3000` — the fallback in
  # constants/site.ts — and Google would index that.
  #
  # TEMPORARY: this is the App Hosting default domain, not southeastmedia.in.
  #
  # STATUS AS AT 2026-07-30 — the TLS fault described here previously is fixed,
  # but the domain still is not ours to point canonicals at:
  #
  #   southeastmedia.in  → 35.219.201.37, HTTPS 200, valid certificate, and the
  #                        body is a 114-byte parking stub whose only content is
  #                        `window.location.href = "/lander"`.
  #   www.southeastmedia.in → same address, serves the Firebase "Site Not Found"
  #                        page.
  #
  # So DNS is already aimed at Firebase, but the domain has never been bound to
  # THIS App Hosting backend. Until it is, southeastmedia.in does not serve the
  # site at all.
  #
  # Do not "fix" this by setting the value to https://southeastmedia.in ahead of
  # that binding. This string is the origin baked under every canonical tag,
  # og:image and sitemap entry at BUILD time, so doing so would point Google and
  # every link preview at the parking stub — strictly worse than the backend URL,
  # which at least resolves to the real site.
  #
  # TO CUT OVER, in this order:
  #   1. Firebase console → App Hosting → the `southeastmedia` backend → add the
  #      custom domain southeastmedia.in (and www), and complete the DNS records
  #      it asks for at the registrar.
  #   2. Confirm `curl -sI https://southeastmedia.in` returns the site, not the
  #      stub — check for a real <title>, not a 114-byte body.
  #   3. Only then change the value below to https://southeastmedia.in and
  #      redeploy, so the prerender picks it up.
  #
  # Leaving it here long-term makes the backend URL the site's advertised
  # identity, which is not what should end up in a search index.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://southeastmedia--southeastmedia-1f79d.asia-southeast1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # ─── Contact form delivery — add when the Resend account is ready ──────────
  #
  # Until one of these is set the enquiry form still accepts submissions, but
  # they reach only the Cloud Logging stream. See lib/contact-delivery.ts.
  #
  # Plain values go here as `value:`. The API key must NOT: put it in Secret
  # Manager (`firebase apphosting:secrets:set RESEND_API_KEY`) and reference it
  # with `secret:` so it never enters the repository.
  #
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME
  # - variable: CONTACT_TO_EMAIL
  #   value: studio@southeastmedia.in
  #   availability:
  #     - RUNTIME
  # - variable: CONTACT_FROM_EMAIL
  #   value: Southeast Media <enquiries@southeastmedia.in>
  #   availability:
  #     - RUNTIME
