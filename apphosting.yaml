# Firebase App Hosting configuration.
# Reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Every page except /api/contact is statically prerendered and served from
  # App Hosting's CDN, so the container is only woken for enquiry POSTs and
  # cache misses. Zero idle instances is the right default at this traffic.
  # Raise to 1 if a cold start on the first uncached hit is unacceptable.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # MUST be available at BUILD, not just RUNTIME.
  #
  # All 17 pages are prerendered during `next build`, which is when canonical
  # tags, Open Graph image URLs and every sitemap entry are baked into the HTML.
  # A runtime-only value arrives far too late to change any of them: the site
  # would ship canonicals reading `http://localhost:3000` — the fallback in
  # constants/site.ts — and Google would index that.
  #
  # WHY www AND NOT THE BARE DOMAIN
  #
  # The string here is the origin frozen under every canonical tag, og:image and
  # sitemap entry at BUILD time, so it must name the host that is meant to
  # answer when a crawler follows it. `www` is that host: it is bound to this
  # backend and holds a valid Google Trust Services certificate for
  # `www.southeastmedia.in` and `*.www.southeastmedia.in`.
  #
  # The apex, southeastmedia.in, is not bound. Its A records still point at
  # GoDaddy's forwarding addresses, so it serves a parking stub and App Hosting
  # has never been able to issue a certificate for it. Pointing this value there
  # would bake an origin that does not serve the site into all 11 prerendered
  # pages.
  #
  # CAUTION — as at 2026-08-04 `www` is itself 404ing at the Google edge: DNS
  # and certificate are correct but the host→backend mapping is broken, so no
  # request reaches Next.js. That is a console-side fault, not a wrong value
  # here; `www` remains the correct canonical and this line should NOT be
  # changed to work around it. See "Domain status" in DEPLOYMENT.md.
  #
  # ONCE THE APEX IS BOUND, prefer a redirect over a second live host: configure
  # southeastmedia.in → https://www.southeastmedia.in in the Firebase console, so
  # one origin serves and the other forwards. If instead both end up serving,
  # this stays as-is and the canonical tags dedupe them for search engines —
  # correct, just less tidy. Do not add a host-based redirect in next.config.ts:
  # these pages are CDN-served and a cached cross-host redirect is a loop
  # waiting to happen.
  #
  # Changing this value requires a redeploy to take effect — the prerender is
  # where it gets baked, so a restart alone does nothing.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.southeastmedia.in
    availability:
      - BUILD
      - RUNTIME

  # Google Analytics 4 measurement ID.
  #
  # BUILD is the availability that matters, for the same reason as the value
  # above: `NEXT_PUBLIC_` variables are inlined into the client bundle by
  # `next build`. Declared RUNTIME as well only so a running container reports
  # the same value it was built with.
  #
  # A plain `value:` and not a secret — a measurement ID is published in the
  # site's own HTML by design, so Secret Manager would protect nothing while
  # making the build fail on a missing grant. The API key below IS a secret; do
  # not use this entry as the pattern for it.
  #
  # Removing this variable is the supported off switch: the root layout mounts
  # nothing when it is empty, so no gtag.js request is made at all. Changing it
  # requires a redeploy, not a restart — the prerender is where it gets baked.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-9QCPZJG800
    availability:
      - BUILD
      - RUNTIME

  # Microsoft Clarity project ID — session replay and heatmaps.
  #
  # Everything said about the GA measurement ID above applies here unchanged:
  # BUILD is the availability that matters because `NEXT_PUBLIC_` values are
  # inlined into the client bundle by `next build`, a plain `value:` is correct
  # because the ID is published in the site's own HTML by design, removing the
  # variable is the supported off switch, and changing it needs a redeploy
  # rather than a restart.
  - variable: NEXT_PUBLIC_CLARITY_PROJECT_ID
    value: xytc24b20t
    availability:
      - BUILD
      - RUNTIME

  # ─── Contact form delivery — REQUIRED. Add when the Resend account is ready ─
  #
  # THE ENQUIRY FORM DOES NOT WORK UNTIL ONE TRANSPORT HERE IS SET. With none
  # configured there is nowhere for a brief to go, so /api/contact answers 502
  # and the visitor is shown the studio email instead of a confirmation — the
  # enquiry is written to Cloud Logging for recovery, but nobody is told it
  # arrived. That is deliberate: reporting success for a brief that reached
  # no one loses every lead silently. See lib/contact-delivery.ts.
  #
  # Plain values go here as `value:`. The API key must NOT: put it in Secret
  # Manager (`firebase apphosting:secrets:set RESEND_API_KEY`) and reference it
  # with `secret:` so it never enters the repository.
  #
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME
  # - variable: CONTACT_TO_EMAIL
  #   value: info@southeastmedia.in
  #   availability:
  #     - RUNTIME
  # - variable: CONTACT_FROM_EMAIL
  #   value: Southeast Media <enquiries@southeastmedia.in>
  #   availability:
  #     - RUNTIME
